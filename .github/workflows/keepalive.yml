# Empêche la mise en pause du projet Supabase gratuit (inactivité > 7 jours).
# Secrets requis (Settings > Secrets and variables > Actions) :
#   SUPABASE_URL       ex. https://abcd.supabase.co
#   SUPABASE_ANON_KEY  clé publique (anon / publishable) — JAMAIS la clé service_role
name: Supabase keepalive
on:
  schedule:
    - cron: "17 6 * * 1,4"   # lundi et jeudi
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 20 -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}'
