# Publie le dossier web/ sur GitHub Pages à chaque push sur main.
name: Déploiement GitHub Pages
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Anti-cache : chaque déploiement versionne les fichiers (?v=<commit>) pour que
      # les téléphones chargent toujours la dernière version de l'appli.
      - name: Versionnage des fichiers
        run: |
          V="${GITHUB_SHA::8}"
          find web/js -name '*.js' -print0 | xargs -0 perl -pi -e "s#(from\s+'\.{1,2}/[^']+?\.js)'#\$1?v=$V'#g"
          perl -pi -e "s#(href|src)=\"(css/app\.css|js/main\.js|vendor/supabase\.js)\"#\$1=\"\$2?v=$V\"#g" web/index.html
          grep -c "?v=$V" web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
